<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>SupplyX</title>
    
    <script>
      // Self-Healing Protocol: Force removal of legacy Service Workers and caches
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          if (registrations && registrations.length > 0) {
            console.log('[SupplyX] Legacy Service Worker detected! Initiating deep-purge and reload...');
            var promises = [];
            for (var i = 0; i < registrations.length; i++) {
              promises.push(registrations[i].unregister());
            }
            if ('caches' in window) {
              promises.push(
                caches.keys().then(function(keys) {
                  return Promise.all(keys.map(function(key) {
                    return caches.delete(key);
                  }));
                })
              );
            }
            Promise.all(promises).then(function() {
              console.log('[SupplyX] Purge completed! Standardizing page state...');
              setTimeout(function() {
                window.location.reload(true);
              }, 300);
            });
          }
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
